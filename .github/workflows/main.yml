name: Build, test and publish nuget package
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './src/MartinDrozdik.DDD.slnx'
  MODELS_PROJECT: './src/MartinDrozdik.DDD/MartinDrozdik.DDD.csproj'
  MODELS_PROJECT_TESTS: './src/MartinDrozdik.DDD.Tests/MartinDrozdik.DDD.Tests.csproj'
  DEMO_PROJECT_PATH: './src/MartinDrozdik.DDD.Demo/MartinDrozdik.DDD.Demo.csproj'
  DEMO_PROJECT_CLIENT_PATH: './src/MartinDrozdik.DDD.Demo.Client/MartinDrozdik.DDD.Demo.Client.csproj'
  DEMO_PROJECT_TESTS: './src/MartinDrozdik.DDD.Demo.Tests/MartinDrozdik.DDD.Demo.Tests.csproj'
  WEB_PROJECT: './src/MartinDrozdik.DDD.Web/MartinDrozdik.DDD.Web.csproj'
  WEB_PROJECT_TESTS: './src/MartinDrozdik.DDD.Web.Tests/MartinDrozdik.DDD.Web.Tests.csproj'
jobs:
  validate-markdown:
    name: Validate Markdown Links
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Check markdown links
      uses: tcort/github-action-markdown-link-check@v1
        
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate-markdown
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Display .NET version
      run: dotnet --version
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          src/**/bin/Release/**
          src/**/obj/Release/**
        retention-days: 1

  test:
    name: Tests – ${{ matrix.project_name }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false # Keep running other tests if one fails
      matrix:
        include:
          - project_name: "Models"
            env_path_key: "PATH_MODELS_TESTS"
          - project_name: "Demo"
            env_path_key: "PATH_DEMO_TESTS"
          - project_name: "Web"
            env_path_key: "PATH_WEB_TESTS"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
      
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: src/
      
    - name: Run model tests
      run: dotnet test ${{ env[matrix.env_path_key] }} --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=${{ matrix.project_name }}-results.trx" --results-directory ./TestResults
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        comment_mode: off
        files: |
          TestResults/**/*.trx
        check_name: Test results – ${{ matrix.project_name }}

  publish-nuget:
    name: Publish ${{ matrix.project_name }} NuGet Package
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - project_name: "MartinDrozdik.DDD"
            env_path_key: "MODELS_PROJECT"
          - project_name: "MartinDrozdik.DDD.Web"
            env_path_key: "WEB_PROJECT"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build NuGet project
      run: dotnet build ${{ env[matrix.env_path_key] }} --configuration Release --no-restore
      
    - name: Pack NuGet package
      run: dotnet pack ${{ env[matrix.env_path_key] }} --configuration Release --no-build --output ./packages
      
    - name: Publish to NuGet
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate