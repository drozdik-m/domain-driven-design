name: Build, test and publish nuget package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './src/MartinDrozdik.DDD.slnx'

  MODELS_PROJECT: './src/MartinDrozdik.DDD/MartinDrozdik.DDD.csproj'
  MODELS_PROJECT_TESTS: './src/MartinDrozdik.DDD.Tests/MartinDrozdik.DDD.Tests.csproj'

  DEMO_PROJECT_PATH: './src/MartinDrozdik.DDD.Demo/MartinDrozdik.DDD.Demo.csproj'
  DEMO_PROJECT_CLIENT_PATH: './src/MartinDrozdik.DDD.Demo.Client/MartinDrozdik.DDD.Demo.Client.csproj'
  DEMO_PROJECT_TESTS: './src/MartinDrozdik.DDD.Demo.Tests/MartinDrozdik.DDD.Demo.Tests.csproj'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Display .NET version
      run: dotnet --version
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          src/**/bin/Release/**
          src/**/obj/Release/**
        retention-days: 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      issues: read
      checks: write
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
      
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: src/
      
    - name: Run model tests
      run: dotnet test ${{ env.MODELS_PROJECT_TESTS }} --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=model-test-results.trx" --results-directory ./TestResults
    
    - name: Run demo tests
      run: dotnet test ${{ env.DEMO_PROJECT_TESTS }} --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=demo-test-results.trx" --results-directory ./TestResults
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        comment_mode: off
        files: |
          TestResults/**/*.trx
        check_name: .NET Test Results

  publish-nuget:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build NuGet project
      run: dotnet build ${{ env.MODELS_PROJECT }} --configuration Release --no-restore
      
    - name: Pack NuGet package
      run: dotnet pack ${{ env.MODELS_PROJECT }} --configuration Release --no-build --output ./packages
      
    - name: Publish to NuGet
      run: dotnet nuget push ./packages/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate